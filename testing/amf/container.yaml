# Container list excerpt from ../../open5gs-pod.yaml; requires its shared Pod and ConfigMap.
- name: amf
  image: docker.io/gradiant/open5gs:2.7.5
  # start after NRF is listening; AMF retries registration but this avoids noisy logs
  command: ["/bin/sh", "-c", "sleep 3 && exec /opt/open5gs/bin/open5gs-amfd -c /etc/open5gs/amf.yaml"]
  volumeMounts:
    - {name: config, mountPath: /etc/open5gs, readOnly: true}
